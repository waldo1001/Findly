name: release-stores

# docs/store-readiness.md §5 (A57/I60): the one-button production release. Manual only — never on
# push (android.yml/ios.yml stay internal-track/TestFlight-only). Every job that can change a store
# runs in the `production` environment: required reviewer, deployable from main only.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which stores"
        type: choice
        options: [both, android, ios]
        default: both
      release_notes:
        description: "Release notes / What's New (plain text, max 500 characters, every locale)"
        type: string
        required: true
      dry_run:
        description: "Dry run: read and validate everything, change nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-stores
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platforms == 'both' || inputs.platforms == 'android'
    uses: ./.github/workflows/_release-android.yml
    with:
      release_notes: ${{ inputs.release_notes }}
      dry_run: ${{ inputs.dry_run }}
    # No `secrets:` on purpose (§5, credential placement): PLAY_SERVICE_ACCOUNT_JSON is an
    # environment secret of `production`, read inside the called workflow by the job that declares
    # that environment. It is never a repository secret and never passed through this caller.

  ios:
    if: inputs.platforms == 'both' || inputs.platforms == 'ios'
    uses: ./.github/workflows/_release-ios.yml
    with:
      release_notes: ${{ inputs.release_notes }}
      dry_run: ${{ inputs.dry_run }}
    # Least privilege: pass only the credentials this job needs, never `secrets: inherit`.
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
