name: ios

on:
  push:
    branches: [main]
    paths: ["mobile/ios/**", ".github/workflows/ios.yml"]
  # Deliberately NO path filter on pull_request: ios-package + ios-build are required checks
  # on main, and a path-filtered workflow never reports its checks on non-matching PRs — every
  # non-mobile PR would hang on "Expected — waiting for status" (same fix as backend.yml).
  pull_request:

jobs:
  package:
    # FindlyKit (specs/004-ios-client.md) — the SPM package holding ALL iOS logic + the design
    # system — builds & tests on a real macOS/Xcode runner. This is real CI (not a structure
    # check): a genuine `swift build` + `swift test` gate for every PR touching mobile/ios/.
    name: ios-package
    runs-on: macos-14
    # H10 (docs/security-review-checklist.md §2): explicit, minimal, job-level permissions —
    # this job only checks out and builds/tests a local SPM package, no deploy.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/ios/FindlyKit
    steps:
      - uses: actions/checkout@v4
      # H1 CI note (2026-07-20): this runner's default active developer directory can select
      # an Xcode whose compiler (Swift 5.10) is older than the Command Line Tools' bundled
      # `Testing.framework` (built with Swift 6.0.3) — "this SDK is not supported by the
      # compiler". Explicitly select the newest available Xcode 16.x before building.
      - name: select a Swift-6-capable Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 16.x found on this runner. Available Xcode installs:"
            ls -d /Applications/Xcode*.app 2>/dev/null
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  build:
    # Unique job name: required status checks match on job names, and "build" would
    # collide with the android workflow's job.
    name: ios-build
    # I9: the Findly.xcodeproj app target now exists (generated via xcodegen, specs/004 §1.1) —
    # real xcodebuild CI, not a structure check. Needs a real macOS/Xcode runner.
    runs-on: macos-14
    # H10 (docs/security-review-checklist.md §2): explicit, minimal, job-level permissions.
    # TestFlight publishing (below) authenticates with its own App Store Connect API key secret,
    # not a GITHUB_TOKEN scope, so `contents: read` stays correct even with publishing added.
    permissions:
      contents: read
    # H10: the three App Store Connect secrets, mapped to job-level env so a step's `if:` can
    # read them (same reasoning as android.yml's ANDROID_KEYSTORE_BASE64 — see that file's A7
    # comment). Empty on forks/PRs and before a human provisions the real secrets
    # (docs/store-readiness.md §2) — every `if:` below checks `!= ''`.
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      # Same Xcode-selection logic as the `package` job above (H1 CI note) — kept in sync
      # deliberately rather than factored out, since each job's `defaults.run.working-directory`
      # differs and a shared step needs its own working-directory handling either way.
      - name: select a Swift-6-capable Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 16.x found on this runner. Available Xcode installs:"
            ls -d /Applications/Xcode*.app 2>/dev/null
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      # The google-services Firebase SPM plugin (FirebaseAuthProvider, specs/004 §4.1) needs
      # mobile/ios/GoogleService-Info.plist to exist at build time once the real Firebase SPM
      # dependency lands (H1 follow-up); today's project has no Firebase package dependency yet,
      # so this file isn't actually consumed by the build below, but the placeholder is added now
      # (mirroring android.yml's "generate placeholder google-services.json" step) so this job
      # doesn't silently start depending on an untracked, gitignored file the moment that
      # dependency is added. Obviously-fake throughout (docs/security-review-checklist.md §1 —
      # no `AIza…`-prefixed key, which the checklist's own secret-scan grep matches); this file
      # never authenticates against anything real. The real file (gitignored, developer-machine
      # only) has the actual `com.findly.ios` / `findly-71f7b` project values.
      - name: generate placeholder GoogleService-Info.plist
        run: |
          cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>CI-PLACEHOLDER-NOT-A-REAL-API-KEY</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.findly.ios</string>
            <key>PROJECT_ID</key>
            <string>findly-ci-placeholder</string>
            <key>STORAGE_BUCKET</key>
            <string>findly-ci-placeholder.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          PLIST
      # Real build (not just a structure check): compiles the Findly app target + links FindlyKit
      # as a local SPM dependency. A pinned device name + `OS:latest` (the previous form) broke
      # when the runner image's newest simulator runtime (18.2) stopped pairing with "iPhone 15"
      # (only "iPhone 16"+ ship at that OS) — confirmed via CI log, `xcodebuild: error: Unable to
      # find a device matching the provided destination specifier`. This job only builds (never
      # runs on the simulator), so `generic/platform=iOS Simulator` sidesteps the whole
      # device/OS-availability pairing and can't go stale the same way again.
      # CODE_SIGNING_ALLOWED=NO (H6, 2026-08-04): project.yml now sets a real DEVELOPMENT_TEAM
      # (92A2K3Q7NH) so device/TestFlight builds can sign. This runner has no Apple credentials,
      # and with a team set, automatic signing would try to resolve a provisioning profile for
      # com.findly.ios (and the extension) and fail. Simulator builds never need signing, so
      # disabling it here keeps this job checking exactly what it's meant to check — that the code
      # compiles and the extension embeds — without depending on secrets CI deliberately lacks.
      - name: build
        run: xcodebuild build -scheme Findly -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      # H10 (docs/implementation-handoff.md): same build-number reasoning as android.yml's
      # "compute release version code" step — Apple rejects a reused CURRENT_PROJECT_VERSION the
      # same way Play rejects a reused versionCode, and this workflow's own `github.run_number`
      # only ever increases. Always computed (cheap, no secret needed); only consumed by the
      # gated release step below, via `release-testflight.sh`'s optional BUILD_NUMBER env var
      # (see that script's header) — project.yml/project.pbxproj are never edited.
      - name: compute release build number
        id: version
        run: echo "number=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
      # H10 (docs/store-readiness.md §2 — human prerequisites): TestFlight from CI, gated the
      # same way as android.yml's Play publish step — `ASC_API_KEY_P8` empty (no secret
      # provisioned yet, or a fork/PR run) is a silent no-op, never a failure. Gated to `main`
      # too: a signed, uploadable archive is only ever built from `main`, same as Android's
      # release signing.
      #
      # `ASC_API_KEY_P8` is the .p8 file's contents, base64-encoded (same convention as
      # android.yml's ANDROID_KEYSTORE_BASE64) — decoded here to the exact path
      # `release-testflight.sh` documents that `xcrun altool` reads by default. Never echoed,
      # never logged, written with 600 perms, and shredded in the always-run cleanup step below
      # regardless of outcome — it must not persist anywhere past this job (checklist "Security"
      # requirement: the Play service account JSON and the .p8 must never persist in the
      # workspace or an artifact). $HOME is outside the checked-out repo, and nothing in this job
      # uploads an artifact, so it's never captured either way.
      - name: write App Store Connect API key
        if: env.ASC_API_KEY_P8 != '' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      # XcodeGen is not preinstalled on the macos-14 runner image (verified against
      # actions/runner-images' macos-14 software manifest, 2026-08-06) but
      # `release-testflight.sh` requires it (`xcodegen generate`, regenerating the project from
      # project.yml before archiving) — install only when the release step will actually run.
      - name: install XcodeGen
        if: env.ASC_API_KEY_P8 != '' && github.ref == 'refs/heads/main'
        run: brew install xcodegen
      # The existing script (mobile/ios/scripts/release-testflight.sh, H6) runs unchanged apart
      # from the new optional BUILD_NUMBER override above — same archive/export/upload steps a
      # developer laptop already ran manually.
      - name: release to TestFlight
        if: env.ASC_API_KEY_P8 != '' && github.ref == 'refs/heads/main'
        run: scripts/release-testflight.sh
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
      # Always runs (even if the steps above failed) so the decoded .p8 never lingers on the
      # runner past this job; a no-op when the write step above didn't run (nonexistent path).
      # `shred` isn't part of macOS's BSD userland (unlike Linux's coreutils), hence the
      # overwrite-then-remove fallback.
      - name: shred App Store Connect API key
        if: always()
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ -f "$KEY_PATH" ]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u "$KEY_PATH"
            else
              SIZE=$(wc -c < "$KEY_PATH" | tr -d ' ')
              dd if=/dev/urandom of="$KEY_PATH" bs=1 count="$SIZE" conv=notrunc >/dev/null 2>&1 || true
              rm -f "$KEY_PATH"
            fi
          fi
