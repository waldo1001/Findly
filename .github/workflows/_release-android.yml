name: _release-android

# docs/store-readiness.md §5 (A57): promote the current Internal-testing release of
# com.findly.android to Production and Closed testing – Alpha, in one Play Developer API edit
# (tools/play-release). A reusable workflow with no trigger of its own: release-stores.yml calls it
# (workflow_dispatch only — never on push).
#
# CREDENTIAL PLACEMENT (§5, normative). PLAY_SERVICE_ACCOUNT_JSON is NOT passed in by the caller and
# is NOT a repository secret (a repository secret reaches every same-repo pull-request build). It is
# an *environment* secret of `production`, and GitHub resolves it for the job below because that job
# declares `environment: production`. So there is deliberately no `workflow_call.secrets` here.
#
# What the environment does and does not do — stated plainly, because it is easy to over-read:
#   - it keeps the key away from pull-request builds (they cannot reference `production`; its
#     deployment rule is `main` only), and
#   - it puts one human approval (required reviewer) in front of *this* workflow's use of the key.
# It does NOT make the key itself approval-gated: the same key is also an environment secret of
# `play-internal` (no reviewer, main only), read by android.yml's internal-track publish job. Code
# that runs on `main` can therefore use the key — and, since the account now holds "Release to
# production", publish to production — without this approval. The accepted trade-off (§5) is that
# `main` is trusted and that Play still reviews every production release; the approval gates this
# button, not the key.

on:
  workflow_call:
    inputs:
      release_notes:
        description: "Release notes, plain text, 1-500 characters, used for every store-listing language"
        type: string
        required: true
      dry_run:
        description: "Read and validate everything (Play edit is validated, then deleted); change nothing"
        type: boolean
        required: true

jobs:
  release:
    # Unique job name, same reason as android-build in android.yml: status checks and the run UI
    # match on job names.
    name: android-release
    runs-on: ubuntu-latest
    # §5: required reviewer (waldo1001), deployable from main only. This is also what makes the
    # `production` environment secret PLAY_SERVICE_ACCOUNT_JSON available to this job.
    environment: production
    timeout-minutes: 10
    # A59 review (§5, "Shared edit lock"): Google allows one open Play edit per user, and this job
    # shares its service account with android.yml's `publish-internal` (which uploads on every push to
    # main). Overlapping runs would invalidate each other's edits — one job fails, nothing is cancelled
    # in Play. The same group name there makes the two take turns; the two blocks MUST stay identical.
    #   - `cancel-in-progress: false`: a running edit is never killed mid-flight.
    #   - `queue: max`: waiting runs queue first in, first out (up to 100 pending). With GitHub's
    #     default (`queue: single`) only one run may be pending and a newer one replaces it, so this
    #     release, queued behind a running upload, could be silently cancelled by the next main push's
    #     upload (with `platforms: both`, a split release: iOS ships, Android does not).
    # Consequence to know: a release waiting for approval may hold the lock, so internal uploads queue
    # behind it until it is approved or rejected. The group name is repository-wide.
    # actionlint does not know `queue` yet: 1.7.12 reports `unexpected key "queue" for "concurrency"
    # section` (rhysd/actionlint#746). GitHub documents the key (docs.github.com, "Control the
    # concurrency of workflows and jobs"); the repo does not run actionlint in CI, so that finding is
    # expected here and in android.yml. (release-stores.yml's own workflow-level `release-stores` group
    # is unchanged.)
    concurrency:
      group: play-edits
      cancel-in-progress: false
      queue: max
    # docs/security-review-checklist.md §2: the only GitHub token scope needed is checkout. Publishing
    # authenticates with its own service-account key, not a GITHUB_TOKEN scope; no id-token here.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/play-release
    steps:
      # Both actions are pinned to a full commit SHA (a tag is mutable, and this job sits next to a
      # production-publishing credential) — stricter than android.yml's first-party `@v4`, which the
      # checklist's pinning rule (first-party: major version at least) would also allow here.
      # SHAs verified 2026-10-05 via `gh api repos/actions/<name>/git/refs/tags/v4.4.0`; v4.4.0 is
      # the latest v4 release of each, and the moving `v4` tag points at the same commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing below pushes; don't leave the checkout token in .git/config for the npm steps.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24, matching backend.yml. No `cache:` — a cache restored into a job that holds a
          # production credential is a poisoning path, and the tree installs in seconds.
          node-version: 24
      # The tool's tests do NOT run here: they run on every PR and push in tools.yml, a workflow with
      # no secrets. This job runs only what it must before the credentialed step — an install with
      # lifecycle scripts off, and the TypeScript build (`tsc`).
      #
      # Honest limit: `npm ci` still installs dev dependencies (typescript, vitest, their trees) from
      # the lockfile, and `tsc` is dev-dependency code executing in this job's filesystem before the
      # credentialed step. The credential is mapped into that last step's env only, so the install
      # and build steps cannot read it — but a compromised dev dependency could still tamper with
      # `dist/` and thereby with the code that later receives the credential. Dropping the test
      # runner removes the largest dependency tree and the arbitrary test code from this job; it
      # narrows the supply-chain exposure, it does not close it. The lockfile + `npm ci` (integrity
      # hashes) is the control that remains.
      - name: install
        run: npm ci --ignore-scripts
      - name: build
        run: npm run build
      # docs/security-review-checklist.md §2 (script injection): the dispatcher's free-text release
      # notes and the dry-run flag reach the tool only through `env:`, never interpolated into the
      # `run:` script. The tool validates all three values before its first network call, registers
      # the signed assertion and the access token with `::add-mask::`, sends them only to
      # https://oauth2.googleapis.com/token, and never prints the key, the assertion or the token.
      - name: promote Internal testing to Production and Alpha
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node dist/cli.js
