name: android

on:
  # Manual trigger (H10 follow-up): the publish steps only fire on a push touching
  # mobile/**, so without this there is no way to re-run a failed store upload, or to
  # prove the pipeline works, without inventing a code change.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  # Deliberately NO path filter on pull_request: android-build is a required check on main,
  # and a path-filtered workflow never reports its checks on non-matching PRs — every
  # non-mobile PR would hang on "Expected — waiting for status" (same fix as backend.yml).
  pull_request:

jobs:
  build:
    # Unique job name: required status checks match on job names, and "build" would
    # collide with the ios workflow's job.
    name: android-build
    runs-on: ubuntu-latest
    # H10 (docs/security-review-checklist.md §2): permissions moved from workflow level to job
    # level — this is the only job in the workflow, and it still needs nothing beyond checkout.
    # Publishing to Play (below) authenticates with its own service-account JSON secret, not a
    # GITHUB_TOKEN scope, so `contents: read` stays correct even with publishing added.
    permissions:
      contents: read
    # A7 (docs/store-readiness.md §1): the four release-signing secrets are mapped to job-level
    # env here — a step's `if:` cannot read `secrets.*` directly, and cannot read env vars set in
    # its *own* `env:` block (only workflow/job-level env is visible to a step's own `if:`), so
    # job-level is the only place this works. On forks/external PRs, and before H5 provisions the
    # real secrets, these are empty strings (not missing) — every `if:` below checks `!= ''`.
    # H10: MAPS_API_KEY (every CI-built artifact previously shipped a blank map,
    # docs/implementation-handoff.md H10) follows the same pattern.
    # A57 (docs/store-readiness.md §5, credential placement): PLAY_SERVICE_ACCOUNT_JSON is no longer
    # here. It used to be mapped into this job's env, i.e. visible to every step of every same-repo
    # pull-request build; it is now an environment secret read only by the `publish-internal` job
    # below, which never runs on pull_request.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Structure check — cheap, always valid regardless of the Gradle project's state.
      - name: structure check
        run: |
          test -f mobile/android/README.md
          test -f mobile/android/.gitignore
          test -f mobile/android/settings.gradle.kts
          echo "android scaffold OK"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # A1 (specs/003-android-client.md §13.4) deliberately did not commit gradlew /
      # gradle-wrapper.jar — no JDK/Gradle toolchain existed in that sandbox to produce a
      # verified one. `gradle-version` installs Gradle directly instead of relying on a
      # committed wrapper; the step below then generates the wrapper for any later local use.
      # A20: v6 (unlike v4) defaults `cache-provider` to "enhanced" — a proprietary caching
      # backend (gradle-actions-caching) that routes build/cache data through Gradle's own
      # service rather than GitHub's, a third-party data-egress path this workflow didn't
      # previously have, and requires accepting Gradle's Terms of Use merely by upgrading.
      # This holds regardless of repo visibility. `cache-provider: basic` opts back into the
      # MIT-licensed, open-source actions/cache-based provider that v4 always used — same
      # caching behavior, no new third-party data path, no license terms silently accepted.
      # Verified against gradle/actions' setup-gradle/action.yml at v6.3.0 (default 'enhanced',
      # "uses the full-featured commercial caching service") and v4.4.3 (no `cache-provider`
      # input exists at all — caching was unconditionally open-source).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-provider: basic
      - name: generate Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 9.6.1 --distribution-type bin
      # A14 (docs/implementation-handoff.md, mobile/android/app/build.gradle.kts): compileSdk/
      # targetSdk 37 needs the `platforms;android-37.0` SDK component. AGP *can* auto-download
      # missing components on demand (verified locally — see A14's report), but that path is
      # silently network- and license-acceptance-dependent and must not be the only thing
      # standing between a green build and a red one on `ubuntu-latest`: the runner image's
      # bundled Android SDK is refreshed on its own cadence and is not guaranteed to already
      # carry a platform release this recent. Installing explicitly here makes the dependency
      # visible and deterministic instead of hoping the implicit auto-download path fires.
      # `sdkmanager`'s location is resolved dynamically rather than hardcoded to one path,
      # since the exact cmdline-tools layout on the runner image isn't a stable contract.
      - name: install Android SDK platform 37
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -iname sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under ANDROID_HOME/ANDROID_SDK_ROOT"; exit 1; }
          # Defensive, not a fix for a current break: this workflow has no `shell:` key and no
          # `defaults.run`, so this step already runs as GitHub's default `bash -e {0}` (no
          # `-o pipefail`) and `yes`'s SIGPIPE exit here is already discarded as-is. The `|| true`
          # guards against that changing later (e.g. a future `shell: bash` addition, which does
          # enable pipefail) — a genuine license-acceptance failure still surfaces loudly on the
          # very next line, when the install itself can't proceed.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      # H1 (specs/003 §13): the google-services Gradle plugin (app/build.gradle.kts) requires
      # app/google-services.json to be present at build time. The REAL file (from the Firebase
      # console) is gitignored and only ever exists on a developer's machine — CI needs a
      # structurally valid placeholder so the plugin's package-name check succeeds without a real
      # Firebase project. Obviously-fake values throughout (docs/security-review-checklist.md
      # §1's "placeholders MUST be obviously fake" — no `AIza…` prefix, which the checklist's own
      # secret-scan grep matches); this file never authenticates against anything real.
      - name: write google-services.json (real when available, placeholder otherwise)
        working-directory: mobile/android
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          # H10 follow-up, 2026-08-07. Same defect the iOS job shipped: this placeholder was
          # correct while the job only COMPILED, but H10 made the same job publish to Play, so
          # build 163 went to the internal track pointing at project 000000000000 /
          # findly-ci-placeholder — Firebase Auth cannot work against a project that does not
          # exist. iOS's equivalent crashed a real iPhone at launch; Android's fails at sign-in
          # instead, which is quieter and arguably worse.
          #
          # The heredoc body and its JSON terminator MUST stay at this exact indentation: YAML
          # strips the block's base indent so they land at column 0, which <<'JSON' requires.
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "Using the real google-services.json from secrets."
          else
          echo "No ANDROID_GOOGLE_SERVICES_JSON secret — writing the CI placeholder (compile-only)."
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "findly-ci-placeholder",
              "storage_bucket": "findly-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.findly.android" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI-PLACEHOLDER-NOT-A-REAL-API-KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
          python3 -c "import json;json.load(open('app/google-services.json'))" && echo 'google-services.json is valid JSON'
      - name: unit tests
        working-directory: mobile/android
        run: ./gradlew test
      # H10 (docs/implementation-handoff.md): Play (and Apple, in ios.yml) reject a reused build
      # number, and both were bumped by hand until now (0.1.0/1 -> 1.0.0 (6) -> 1.0.0 (7),
      # 2026-08-06) — the exact toil this task removes. `github.run_number` is this *workflow's*
      # own run counter: it only ever increases (a new run of `android.yml`, on any branch,
      # always gets a higher number than every prior run), so a value derived from it can never
      # be reused across separate CI runs. The `+ 100` offset is headroom above the last
      # hand-edited value (7) and above what a workflow-recreation-triggered counter reset could
      # plausibly produce, not something the arithmetic depends on for correctness. Always
      # computed (cheap, no secret needed) even though it's only consumed by the two gated steps
      # below.
      - name: compute release version code
        id: version
        run: echo "code=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
      # A7 (docs/store-readiness.md §1): release signing. H5 provisions the real keystore/secrets
      # in GitHub's secret store; until then — and always on PRs, which never need a signed build —
      # `ANDROID_KEYSTORE_BASE64` is empty and these steps are skipped, so the workflow never fails
      # for lack of a secret it can't have yet. Gated to `main` pushes too (not just secret
      # presence): same-repo PR branches DO have secrets access, but a signed artifact is only
      # ever produced from `main`.
      - name: decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # H10: `-PMAPS_API_KEY` wires the CI secret into the build the same way a local dev already
      # could via `-PMAPS_API_KEY=...` or a gitignored `gradle.properties` override (see
      # `app/build.gradle.kts`'s `mapsApiKey` val) — every CI-built artifact previously shipped
      # with a blank map. `MAPS_API_KEY`'s job-level env comes from a repo secret so it isn't
      # hardcoded here, but note its sensitivity is not the same class as the signing/service-
      # account secrets below: a Google Maps Android API key ships inside the built AAB/APK
      # itself (extractable by anyone who downloads the app) and is meant to be restricted via
      # HTTP-referrer/app restrictions in the Google Cloud console (docs/store-readiness.md),
      # not kept confidential — storing it as a secret here just keeps it out of the repo, same
      # as `JOIN_LINK_HOST` would be if it weren't a public constant.
      #
      # H10: kept as APK output (`assembleRelease`) alongside the new AAB below (`bundleRelease`)
      # — Play needs the AAB, but the APK stays useful for sideload/debug installs where an AAB
      # can't be installed directly (`adb install` needs an APK, or `bundletool` to derive one).
      # Review fix: that claim is only real if the APK actually leaves the runner — uploaded as a
      # workflow artifact below (it was previously built, signed, and discarded, which made the
      # stated rationale false). This is exactly the artifact tonight's incident showed is
      # genuinely useful to have on hand.
      - name: assemble APK (signed on main)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PMAPS_API_KEY="$MAPS_API_KEY" -PVERSION_CODE="$VERSION_CODE"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VERSION_CODE: ${{ steps.version.outputs.code }}
      # H10 review fix: upload the signed APK as a workflow artifact — a single named file, not
      # the whole outputs/ directory, so nothing incidental (output-metadata.json, baseline
      # profiles) rides along. `actions/upload-artifact` is first-party (`actions/`), so
      # major-version pinning is enough (docs/security-review-checklist.md §2 — full-SHA pinning
      # is reserved for non-first-party actions like the Play publish step below). Short
      # retention: this is a debug/sideload convenience, not a release archive of record — Play
      # keeps the AAB, App Store Connect keeps the IPA, this is just "the APK from this build was
      # still on hand when someone needed one tonight."
      - name: upload APK artifact
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: findly-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      # H10: the AAB Play actually requires (Play no longer accepts APK uploads for new releases).
      - name: bundle AAB (signed on main, for Play)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        working-directory: mobile/android
        run: ./gradlew bundleRelease -PMAPS_API_KEY="$MAPS_API_KEY" -PVERSION_CODE="$VERSION_CODE"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VERSION_CODE: ${{ steps.version.outputs.code }}
      # Always runs (even if assemble/bundle failed) so the decoded keystore never lingers on the
      # runner; a no-op when the steps above didn't run (rm -f on a nonexistent path).
      - name: clean up decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      # Refuse to publish a build carrying the CI placeholder Firebase config. Build 163 reached
      # the Play internal track that way with sign-in broken. Inspects the file the build actually
      # used, so a failed base64 decode is caught too.
      - name: refuse to ship a placeholder Firebase config
        if: github.ref == 'refs/heads/main'
        working-directory: mobile/android
        run: |
          if grep -q "findly-ci-placeholder\|000000000000" app/google-services.json; then
            echo "::error::google-services.json is the CI placeholder — refusing to publish. Set the ANDROID_GOOGLE_SERVICES_JSON secret (base64 of the real file)."
            exit 1
          fi
          echo "Firebase config is the real one."

      # A57 (docs/store-readiness.md §5, credential placement): the Play publish moved out of this
      # job into `publish-internal` below, so the build — which runs on every pull request and
      # executes PR-supplied Gradle code — never holds a Play credential. The signed AAB crosses
      # over as a workflow artifact. Placed AFTER the placeholder-Firebase refusal above: a build
      # carrying the placeholder fails here, so it never leaves an artifact behind either.
      # `retention-days: 1`: this is a hand-over between two jobs of one run, not an archive (the
      # APK artifact above is the debug/sideload convenience; Play keeps the AAB). Pinned by full
      # SHA — upload-artifact v4.6.2, verified 2026-10-05 via
      # `gh api repos/actions/upload-artifact/git/refs/tags/v4.6.2` (the moving `v4` tag is the same
      # commit) — because the file it carries is what the next job ships to Play.
      - name: upload the signed AAB for the internal-track publish job
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findly-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
          if-no-files-found: error

  # A57 (docs/store-readiness.md §5, credential placement; docs/security-review-checklist.md §2):
  # the internal-track publish, split out of the build job. It is the ONLY job in this workflow that
  # reads PLAY_SERVICE_ACCOUNT_JSON, and that secret is an *environment* secret of `play-internal`
  # (no reviewer, deployable from main only) — not a repository secret, which would have reached
  # every same-repo pull-request build. It never runs on pull_request.
  #
  # A59 (docs/store-readiness.md §5, "Android internal-track upload"): the upload is tools/play-release
  # in its `upload-internal` mode, no longer r0adkll/upload-google-play. Why it was replaced: on
  # 2026-10-05, with production build 234 in review, Play refused this job's commit (the action's
  # `changesNotSentForReview: true` -> "Changes are sent for review automatically. The query parameter
  # changesNotSentForReview must not be set"). That action has no `changesInReviewBehavior` input, so
  # simply dropping the flag would have committed with Play's documented default,
  # CANCEL_IN_REVIEW_AND_SUBMIT — an ordinary push to main silently cancelling the production review.
  # The tool commits with ERROR_IF_IN_REVIEW instead: with a review in progress the upload is deferred
  # (a notice, exit 0 — the next main build after the review uploads) and nothing is cancelled.
  #
  # What this does and does not protect (§5): the key is out of reach of PR builds. It is not
  # approval-gated here — `play-internal` has no reviewer by design, so every green push to main
  # publishes to internal testing, exactly as before. The account also holds "Release to production"
  # (§5, user decision 2026-10-05); the production reviewer gates release-stores.yml, not the key.
  # Since A59 this job also checks out `main` and builds the tool before the credentialed step — the
  # same exposure as release-stores.yml's `android` job, except that unlike the release job nothing
  # approves a push to main here, so protection of `main` is the control (§5, A58). Stated plainly:
  # `npm ci` installs the tool's dev dependencies (typescript, vitest and their trees) from the
  # lockfile and `tsc` runs in this job, so a compromised dev dependency could tamper with `dist/`
  # and so with the code that then receives the key. The credential is mapped into the env of exactly
  # two steps — the presence check (which runs before the checkout) and the final upload; the install
  # and build steps cannot read it. The test runner is not run here (tools.yml runs the tests, in a
  # workflow with no secrets), and no pull-request code reaches this job. The lockfile + `npm ci`
  # (integrity hashes) is the control that remains: it narrows the exposure, it does not close it.
  #
  # Posture change, accepted in the A59 security review (§5): the old action always committed with
  # `changesNotSentForReview: true`, so it could never send anything for review; this job's first
  # commit omits that flag, so Play may send the edit's changes for review. The edit holds only an
  # Internal-track release (no review needed) and `ERROR_IF_IN_REVIEW` is always set; Play refuses to
  # auto-send exactly when unsent changes are pending, and then the tool's one retry sets the flag.
  publish-internal:
    name: android-publish-internal
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: play-internal
    # A59 review: bounded like the release job (10 minutes there), with room for a large AAB upload
    # (the tool allows that one request 5 minutes).
    timeout-minutes: 15
    # A59 review (§5, "Shared edit lock"): Google allows one open Play edit per user, and this job and
    # the release job (release-stores.yml's `android` job) use the same service account. Overlapping
    # runs would invalidate each other's edits — the job fails, nothing is cancelled in Play. One shared group
    # makes them take turns; the two blocks MUST stay identical.
    #   - `cancel-in-progress: false`: a running upload/commit is never killed mid-flight.
    #   - `queue: max`: waiting runs queue first in, first out (up to 100 pending). With GitHub's
    #     default (`queue: single`) only one run may be pending and a newer one replaces it, so a
    #     release queued behind an upload could be silently cancelled by the next main push's upload
    #     (with `platforms: both`, a split release).
    # Consequence to know: a release waiting for approval may hold the lock, so internal uploads queue
    # behind it until it is approved or rejected. The group name is repository-wide.
    # actionlint does not know `queue` yet: 1.7.12 reports `unexpected key "queue" for "concurrency"
    # section` (rhysd/actionlint#746). GitHub documents the key (docs.github.com, "Control the
    # concurrency of workflows and jobs"); the repo does not run actionlint in CI, so that finding is
    # expected here and in release-stores.yml's `android` job.
    concurrency:
      group: play-edits
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      # H10 (docs/implementation-handoff.md, docs/store-readiness.md §4 — human prerequisites):
      # publish the AAB to the Play internal track only. **Deliberately internal-only here, forever —
      # do not add a production (or even closed/open testing) track to this workflow.** Automatic
      # publishing on every green `main` means the household's own devices receive every merge;
      # widening the gate to a track real strangers can reach would mean an untested merge ships to
      # the public the same way tonight's dark-mode bug reached a real phone. (A57: promotion beyond
      # internal testing is now release-stores.yml, a separate manual workflow behind the
      # `production` environment's required reviewer — never this one.) Gated like the signing
      # secrets: an empty `PLAY_SERVICE_ACCOUNT_JSON` (secret not provisioned in `play-internal`
      # yet) is a silent no-op, never a failure: every step below is gated on this one. The check
      # lives in its own tiny step so the secret is mapped into only two steps' env — this one and
      # the final upload.
      - name: check the Play credential is provisioned
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No PLAY_SERVICE_ACCOUNT_JSON secret in the play-internal environment — skipping the Play publish."
          fi
      # A59: the tool (tools/play-release) is checked out and built here, so these three steps come
      # BEFORE the artifact download — a checkout into a workspace that already holds files can wipe
      # them. Both actions are pinned to a full commit SHA (a tag is mutable, and this job holds a
      # Play credential), exactly as in release-stores.yml and tools.yml: v4.4.0 of each, verified
      # 2026-10-05 via `gh api repos/actions/<name>/git/refs/tags/v4.4.0`.
      - name: check out the tool
        if: steps.play.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing below pushes; don't leave the checkout token in .git/config for the npm steps.
          persist-credentials: false
      - name: set up Node
        if: steps.play.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24, matching backend.yml and the release job. No `cache:` — a cache restored into a job
          # that holds a Play credential is a poisoning path, and the tree installs in seconds.
          node-version: 24
      # download-artifact v4.3.0 pinned by full SHA, verified 2026-10-05 via
      # `gh api repos/actions/download-artifact/git/refs/tags/v4.3.0` (the moving `v4` tag is the
      # same commit). Same-run artifact: needs no token beyond the job's own.
      - name: download the signed AAB
        if: steps.play.outputs.present == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: findly-release-aab
          path: aab
      # The tool's tests do NOT run here: tools.yml runs them on every PR and push, in a workflow with
      # no secrets. This job runs only what it must before the credentialed step — an install with
      # lifecycle scripts off, and the TypeScript build. Neither step's env holds the credential.
      - name: install the upload tool
        if: steps.play.outputs.present == 'true'
        working-directory: tools/play-release
        run: npm ci --ignore-scripts
      - name: build the upload tool
        if: steps.play.outputs.present == 'true'
        working-directory: tools/play-release
        run: npm run build

      # H10 / A59: upload the AAB to the Play internal track — only. **Deliberately internal-only here,
      # forever — do not add a production (or even closed/open testing) track to this workflow:** the
      # tool's `upload-internal` mode has no track input and writes only the `internal` track.
      # (Promotion is release-stores.yml, behind the `production` environment's reviewer.)
      #
      # One edit: upload the bundle, set the Internal track to it, commit with
      # `changesInReviewBehavior=ERROR_IF_IN_REVIEW`. Outcomes: committed; or — production review in
      # progress — deferred with a `::notice::` and exit 0 (green job, nothing cancelled, the next
      # main build uploads); or, if Play insists on it (a review state needing attention, first seen
      # 2026-08-16 after build 183 was rejected), one retry committing with `changesNotSentForReview`
      # (still with ERROR_IF_IN_REVIEW) — the internal track needs no review. Anything else fails the job.
      #
      # docs/security-review-checklist.md §2 (script injection): the credential, the mode and the AAB
      # path reach the tool only through this step's `env:` — nothing is interpolated into `run:`.
      # `github.workspace` is the runner's own path, not event text. The tool validates its input before
      # its first network call, registers the signed assertion and the access token with `::add-mask::`,
      # sends them only to https://oauth2.googleapis.com/token and the Play API, and never prints the
      # key, the assertion, the token or the bundle.
      - name: upload the AAB to the Play internal track
        if: steps.play.outputs.present == 'true'
        working-directory: tools/play-release
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_MODE: upload-internal
          AAB_PATH: ${{ github.workspace }}/aab/app-release.aab
        run: node dist/cli.js
