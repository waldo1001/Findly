name: _release-ios

# docs/store-readiness.md §5 (I60): submit the newest processed build of com.findly.ios for App Review.
# Reusable workflow, called only by release-stores.yml (workflow_dispatch, never on push). The logic lives
# in tools/appstore-release (unit-tested, zero runtime dependencies); this file only wires it up.
#
# Security posture (docs/security-review-checklist.md §2):
#  - runs in the `production` environment: required reviewer, deployable from main only;
#  - job-level permissions are contents: read — App Store Connect auth is its own API key, not a GITHUB_TOKEN scope;
#  - every input and secret reaches the script via env:, never `${{ }}` inside a run: body;
#  - the .p8 is never written to disk: ASC_API_KEY_P8 (base64 of the .p8, same convention as ios.yml)
#    is decoded and used in memory by the script, so there is nothing to shred;
#  - DRY_RUN=true makes the script's HTTP client refuse every non-GET request;
#  - ubuntu-latest is enough: this job only talks to the App Store Connect API (no Xcode).

on:
  workflow_call:
    inputs:
      release_notes:
        description: "What's New text, plain, max 4000 characters (applied to every localization)"
        type: string
        required: true
      dry_run:
        description: "Read and validate everything, change nothing (GET requests only)"
        type: boolean
        required: true
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_API_KEY_P8:
        required: true

permissions:
  contents: read

jobs:
  release-ios:
    name: release-ios
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/appstore-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/appstore-release/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      # Writes the Markdown report to $GITHUB_STEP_SUMMARY. Exits non-zero on any failure, including
      # "this marketing version is already live" (bump MARKETING_VERSION in mobile/ios/project.yml).
      - name: submit the newest processed build for App Review
        run: node dist/src/cli.js
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DRY_RUN: ${{ inputs.dry_run }}
