# A18 (docs/security-review-checklist.md §4): keeps the Android Gradle dependency graph from
# going stale between deliberate, human-initiated bumps. This config drives Dependabot *version*
# updates — ordinary scheduled PRs bumping outdated versions — which work from this file alone,
# independent of whether the repo's "Dependabot alerts" / "Dependabot security updates" settings
# (Settings > Code security and analysis) are enabled. Vulnerability-specific alerts additionally
# need the resolved dependency graph submitted, which .github/workflows/android-dependency-graph.yml
# does; see that file's header for why it's a separate, minimally-scoped workflow.
#
# Every PR this opens runs through the existing android workflow (.github/workflows/android.yml)
# unmodified — that workflow's `pull_request` trigger has no path filter specifically so PRs like
# these always get a real build+test verification (`./gradlew test`, `assembleDebug`) before
# anyone merges, not just a version bump nobody re-verified.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
      day: "monday"
    # Single-developer, hobby-scale project (CLAUDE.md: "a few euros/month" cost target, one
    # developer): a handful of open PRs at a time is reviewable, a flood is not.
    open-pull-requests-limit: 5
    # One PR a week for everything that is a minor or patch bump, instead of one PR per artifact
    # (2026-11-02 opened five at once and all five sat unmerged for two weeks). A major bump is
    # left out of the group on purpose: it stays its own PR and a human merges it.
    # .github/workflows/dependabot-auto-merge.yml turns on GitHub auto-merge for the grouped PR,
    # so it merges by itself once every required check on main is green, and never before.
    groups:
      android-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # The Compose BOM is excluded on purpose, permanently (A69 raised the pin to 2026.09.00 and
    # kept this entry). mobile/android/app/build.gradle.kts pins it twice:
    # `implementation(platform("androidx.compose:compose-bom:X"))` and a
    # `constraints { ... strictly("X") }` block (A17). Dependabot can only rewrite the first, so
    # every BOM bump it proposed would conflict with the `strictly` value, fail android-build and
    # hold the whole android-minor-patch group red each time a new BOM ships; the group is meant
    # to auto-merge when green. Raising the BOM is therefore always a hand-made change: edit the
    # platform(...) line and the `strictly` value together, then re-run
    # `./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency
    # androidx.compose:compose-bom` (and the same for releaseRuntimeClasspath): no
    # `compose-bom:X -> Y` line with X different from Y may remain. Vulnerability alerts for
    # compose-bom are unaffected: they come from the graph submitted by
    # .github/workflows/android-dependency-graph.yml, not from this file. Dependabot
    # security-update PRs for compose-bom are suppressed too (they would fail on `strictly`
    # anyway), so an alert on it means a hand-made bump.
    ignore:
      - dependency-name: "androidx.compose:compose-bom"
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "android"
