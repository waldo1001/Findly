# xcodegen project spec — generates Findly.xcodeproj (specs/004-ios-client.md §1.1).
#
# Why xcodegen instead of a hand-authored project.pbxproj: 004 §1.1 explicitly deferred creating
# the .xcodeproj until a session had real Xcode to validate the result. This session does
# (Xcode 26.6). xcodegen generates a real project deterministically from this declarative spec,
# which we then validate with real `xcodebuild` calls — see mobile/ios/README.md.
#
# Regenerate after editing this file: `xcodegen generate` (run from mobile/ios/).
name: Findly
options:
  bundleIdPrefix: com.findly
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# FindlyKit (specs/004 §1.1) — the local Swift Package holding all logic + the design system.
# Referenced as a local package one level up from this project.yml is wrong; FindlyKit is a
# sibling of this project file (mobile/ios/FindlyKit), hence the plain relative path below.
#
# firebase-ios-sdk (specs/009 §5, I12) — real FCM-routed push. Only the two products this task
# actually needs (FirebaseMessaging + its FirebaseCore dependency) are linked below; FirebaseAuth
# is deliberately NOT added here (that's I3's own already-written, `#if canImport(FirebaseAuth)`-
# gated `FirebaseAuthProvider` code, left inert on purpose until a future session's task adds that
# product — not this one's scope). Pinned with `.upToNextMajor` off the last release published
# before this session (`11.15.0`) so `xcodegen generate` + `xcodebuild` resolve a real, reproducible
# version rather than "whatever is newest today".
packages:
  FindlyKit:
    path: FindlyKit
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.15.0

targets:
  # I15 (specs/001 §8.2, specs/000 §O8) — Notification Service Extension. `mutable-content: 1` on
  # the GEOFENCE_EVENT push exists specifically to let an extension like this re-render the alert
  # from `data` before the OS displays it; without one, iOS auto-displays the server's own
  # `aps.alert.title` and the app-level PushMessageDispatcher/GeofenceEventPushHandler path never
  # runs (found by I12, tracked as this task). Depends on FindlyKit ONLY — no Firebase SDK linkage
  # needed here, this target never talks to FCM/APNs registration, it only receives an
  # already-delivered push from the OS. Embedded into the Findly app target below via the
  # `dependencies: [{target: FindlyNotificationService}]` entry, which xcodegen auto-embeds (an
  # app-extension target dependency is embedded + code-signed automatically, no separate copy-files
  # phase needed).
  FindlyNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FindlyNotificationService
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: FindlyNotificationService
        # Sub-identifier under the app's own com.findly.ios bundle id (standard app-extension
        # convention) — H6 must register this as its own App ID in the Apple Developer portal
        # before a real-device/signed build (see mobile/ios/README.md's H6 note).
        PRODUCT_BUNDLE_IDENTIFIER: com.findly.ios.NotificationService
        INFOPLIST_FILE: FindlyNotificationService/Info.plist
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # H6 (2026-08-04): real device signing wired up. The extension's App ID
        # (com.findly.ios.NotificationService) is registered in the Apple portal; an app extension
        # needs its own App ID or a signed build fails. CI is unaffected — .github/workflows/ios.yml
        # builds for a simulator destination with CODE_SIGNING_ALLOWED=NO, so it never resolves a
        # provisioning profile (the runner has no Apple credentials).
        DEVELOPMENT_TEAM: 92A2K3Q7NH
    dependencies:
      - package: FindlyKit
        product: FindlyKit

  Findly:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Findly
        excludes:
          - Info.plist
          - Findly.entitlements
      # Firebase's config file, gitignored (docs/security-review-checklist.md), lives at
      # mobile/ios/GoogleService-Info.plist — a sibling of this project.yml, NOT inside Findly/ —
      # matching both the real, gitignored developer-machine file and .github/workflows/ios.yml's
      # pre-existing "generate placeholder GoogleService-Info.plist" CI step (added ahead of this
      # task by I9, written to the SAME path: the job's working-directory is mobile/ios). Listed as
      # its own explicit source entry (rather than moving/duplicating the file into Findly/) so
      # `xcodegen generate` bundles it as an app resource without disturbing that established path.
      - path: GoogleService-Info.plist
    settings:
      base:
        PRODUCT_NAME: Findly
        PRODUCT_BUNDLE_IDENTIFIER: com.findly.ios
        INFOPLIST_FILE: Findly/Info.plist
        CODE_SIGN_ENTITLEMENTS: Findly/Findly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # H6 (2026-08-04): real device signing wired up — Apple enrollment complete, App IDs
        # registered for both this target and the notification extension, APNs key uploaded to
        # Firebase. Needed for TestFlight/device builds (docs/h6-apple-portal-runbook.md step 6).
        # CI keeps working because .github/workflows/ios.yml builds for a simulator destination
        # with CODE_SIGNING_ALLOWED=NO — a GitHub runner has no Apple credentials, and with a team
        # set, automatic signing would otherwise try to resolve a provisioning profile and fail.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 92A2K3Q7NH
    dependencies:
      - package: FindlyKit
        product: FindlyKit
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: FirebaseSDK
        product: FirebaseCore
      # FirebaseAuth (specs/006, 004 §4) — added 2026-08-05. It was previously left out on
      # purpose, on the reasoning that `FirebaseAuthProvider` is `#if canImport(FirebaseAuth)`-
      # gated and therefore harmless while unlinked. That stopped being true the moment
      # `authMode` became `.firebase`: without this product the gate is false, the provider
      # compiles to its inert `#else` branch whose every method is `throw PhoneAuthError.unknown`,
      # and on-device sign-in fails with "Couldn't sign in. Try again." — with no hint that the
      # implementation simply wasn't in the binary. Found on the first real TestFlight install.
      - package: FirebaseSDK
        product: FirebaseAuth
      # I15 — embeds + code-signs the extension bundle into Findly.app automatically (xcodegen's
      # default for an app-extension-typed target dependency; no explicit `embed: true` needed).
      - target: FindlyNotificationService
    scheme:
      testTargets: []
      gatherCoverageData: false
